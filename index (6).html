:root{--g:#0d4b42;--g2:#17776a;--bg:#f2f5f4;--c:#fff;--t:#17302c;--m:#6b7c78;--b:#dbe4e1;--r:#d93636;--y:#e2a400;--gr:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--g:#1b6b5f;--bg:#0f1a18;--c:#16241f;--t:#e4efec;--m:#9bb0aa;--b:#2a3b36}}
:root[data-theme="dark"]{color-scheme:dark;--g:#1b6b5f;--bg:#0f1a18;--c:#16241f;--t:#e4efec;--m:#9bb0aa;--b:#2a3b36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:14px}
.lg{background:#f3f5f3;border-radius:10px;padding:6px 10px;display:inline-block}.lg img{height:46px;display:block}
.login{min-height:90vh;display:grid;place-items:center;padding:16px}.login .card{width:100%;max-width:380px;text-align:center}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:14px}h3{margin:0 0 10px;color:var(--g2)}
input,select{width:100%;padding:9px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;margin:4px 0 10px}
button{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}button.s{background:var(--c);color:var(--t);border:1px solid var(--b);padding:7px 10px}button.d{background:var(--r)}
.app{display:flex;min-height:100vh}.side{width:210px;background:var(--c);border-inline-end:1px solid var(--b);padding:12px;flex-shrink:0}.side .lg{margin-bottom:12px}
.side a{display:block;padding:10px;border-radius:8px;cursor:pointer;color:var(--t);margin-bottom:2px}.side a.on,.side a:hover{background:var(--g);color:#fff}
.main{flex:1;min-width:0}.top{background:var(--g);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h2{margin:0;font-size:16px;flex:1}.top input{width:200px;margin:0}.top button{background:#ffffff26}
.pg{padding:16px}.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}.kp div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;border-top:4px solid var(--g2)}.kp b{font-size:24px;display:block;color:var(--g2)}.kp .r{border-top-color:var(--r)}.kp .r b{color:var(--r)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.br{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px}.br i{display:block;height:10px;border-radius:5px;background:var(--g2);width:var(--w)}.mu{color:var(--m)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.bar input{width:200px;margin:0}.tw{overflow-x:auto;background:var(--c);border:1px solid var(--b);border-radius:12px}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--b)}th{background:var(--g);color:#fff;position:sticky;top:0}
.ch{padding:2px 9px;border-radius:12px;color:#fff;font-size:12px}.ch.r{background:var(--r)}.ch.y{background:var(--y)}.ch.g{background:var(--gr)}
.mo{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:12px;z-index:9;overflow:auto}.mo .card{width:100%;max-width:560px;max-height:92vh;overflow:auto;margin:0}.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#ts{position:fixed;bottom:20px;left:20px;background:var(--g);color:#fff;padding:10px 16px;border-radius:8px;z-index:20}
@media(max-width:800px){.app{display:block}.side{width:auto;display:flex;overflow-x:auto;gap:4px;padding:8px}.side .lg{display:none}.side a{white-space:nowrap}.top input{width:100%}.fg{grid-template-columns:1fr}.bar input{width:100%}}

.side{background:linear-gradient(180deg,#0a3b34,#0d4b42);border:0;color:#fff}.side a{color:#cfe5e0;font-weight:600;padding:11px 12px;border-radius:10px}.side a.on,.side a:hover{background:#ffffff1f;color:#fff;box-shadow:inset -4px 0 #4fd1b8}
.top{background:var(--c);color:var(--t);border-bottom:1px solid var(--b);box-shadow:0 2px 8px #0000000f}.top h2{color:var(--g2)}.top button{background:var(--g);color:#fff}

.login{background:radial-gradient(circle at 20% 10%,#17776a,#0a3b34)}.login .card{box-shadow:0 10px 40px #0005;border-radius:18px}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dn p{margin:4px 0}.dn i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.cl{display:flex;align-items:stretch;height:190px;gap:8px}.cl>div{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;min-width:0}.cl u{flex:1;display:flex;align-items:flex-end;width:100%;justify-content:center;text-decoration:none}.cl i{display:block;width:70%;background:linear-gradient(180deg,#2fa592,#0d4b42);border-radius:6px 6px 0 0;min-height:2px}
.side a{display:flex;align-items:center;gap:10px}button{display:inline-flex;align-items:center;gap:6px;justify-content:center}.ic{vertical-align:middle;flex-shrink:0}
.kp div{display:flow-root}.ki{float:left;width:42px;height:42px;border-radius:12px;background:#17776a1f;color:var(--g2);display:grid;place-items:center}.kp .r .ki{background:#d936361f;color:var(--r)}
.sec{margin:6px 0 10px;font-size:15px;color:var(--t)}.ins{margin:12px 0 0;padding:9px 11px;background:#17776a12;border-radius:10px;font-size:12.5px;line-height:1.7;color:var(--m);display:flex;gap:8px;align-items:flex-start}.ins .ic{margin-top:3px;color:var(--g2)}
.ops{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0 12px}.cb{display:flex;align-items:center;gap:6px;margin:0}.cb input{width:auto;margin:0}
.ops2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin:6px 0 12px}.ob{display:flex;gap:8px;align-items:center}.ob>input[type=number]{margin:0;width:130px}

<div class="kp"><div>متوسط المسافة بين تغييرات زيت المحرك<b>${n(avg(gaps))} كم</b></div><div>متوسط عمر الإطار<b>${n(avg(life))} كم</b></div><div>إجمالي الإطارات المستهلكة<b>${n(T.reduce((s,r)=>s+1,0))}</b></div><div class="r">تغيير زيت قبل موعده<b>${early.length}</b></div></div>`}

function draw(v){document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.dataset.p==page));const el=$('#pg'),T=(NAV.find(x=>x[0]==page)||[0,0,'تفاصيل السيارة'])[2];$('#ttl').textContent='نظام الصيانة الدورية – '+T;
if(page=='det'){el.innerHTML=ico(detHtml(v));window._v=v;return}
if(['oil','tire','veh','users'].includes(page)){el.innerHTML=ico(tbl(page));fill(page);$('#q').oninput=e=>{st[page].q=e.target.value;fill(page,0)};const fi=$('#fi');if(fi)fi.onchange=e=>{imp(page,e.target.files[0]);fi.value=''};return}
el.innerHTML={dash,alerts,rep,audit:()=>`<h3>سجل المراجعة</h3><div class="tw"><table><tr><th>الوقت<th>المستخدم<th>القسم<th>العملية<th>البيانات${D.audit.slice(0,300).map(a=>`<tr><td>${a.t}<td>${a.u}<td>${a.sec}<td>${a.act}<td>${a.d}`).join('')}</table></div>`}[page]();el.innerHTML=ico(el.innerHTML)}
async function login(){const{data:{session}}=await SB.auth.getSession();if(session)return enter(session);
let us=[];try{us=(await SB.rpc('login_users')).data||[]}catch(e){}
$('#root').innerHTML=`<div class="login"><div class="card"><div class="lg"><img src="${LOGO}" alt="EL SOADAA GROUP"></div><h3 style="margin-top:14px">نظام إدارة ومتابعة الصيانة الدورية لأسطول السيارات</h3><form id="lf" style="text-align:right"><label>اسم المستخدم<select id="lu">${us.map(u=>`<option value="${u.email}">${u.username}</option>`).join('')}</select></label><label>كلمة المرور<input id="lp" type="password" autocomplete="current-password"></label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="sh" style="width:auto;margin:0"> إظهار كلمة المرور</label><p id="le" style="color:var(--r)"></p><button style="width:100%">تسجيل الدخول</button></form><p class="mu">© EL SOADAA GROUP – قطاع الورشة المركزية</p></div></div>`;
$('#sh').onchange=e=>$('#lp').type=e.target.checked?'text':'password';
$('#lf').onsubmit=async e=>{e.preventDefault();const{data,error}=await SB.auth.signInWithPassword({email:$('#lu').value,password:$('#lp').value});if(error){$('#le').textContent='بيانات الدخول غير صحيحة';return}enter(data.session)}}
async function enter(s){await load();const u=D.users.find(u=>(u.email||'').toLowerCase()==s.user.email.toLowerCase());if(!u||!u.active){await SB.auth.signOut();toast('الحساب غير مفعّل');return login()}me=u;log('الدخول','تسجيل دخول');shell();subscribe();gtAlerts()}
let rt=null;function subscribe(){if(rt)return;let tm;rt=SB.channel('rec').on('postgres_changes',{event:'*',schema:'public',table:'records'},()=>{clearTimeout(tm);tm=setTimeout(async()=>{if(!me||document.querySelector('.mo')||document.activeElement.closest('#q'))return;await load();if(page!='det')draw()},900)}).subscribe()}
function cfg(){$('#root').innerHTML=`<div class="login"><div class="card"><div class="lg"><img src="${LOGO}" alt="EL SOADAA GROUP"></div><h3>إعداد Supabase مطلوب</h3><p class="mu">${window.supabase?'ضع SUPA_URL و SUPA_KEY في أعلى السكربت داخل الملف.':'تعذّر تحميل مكتبة Supabase. تأكد من الاتصال بالإنترنت ثم حدّث الصفحة (Ctrl+F5).'}</p></div></div>`}
document.addEventListener('click',async e=>{const p=e.target.closest('[data-p]');if(p){page=p.dataset.p;return draw()}

const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=page,s=st[k];
if(a=='out'){log('الدخول','تسجيل خروج');if(rt){SB.removeChannel(rt);rt=null}await SB.auth.signOut();me=null;login()}
else if(a=='add')form(k);
else if(a=='edit'){const r=D[k].find(r=>s.sel.has(r.id));if(s.sel.size!=1||!r)return toast('حدد سجلًا واحدًا');form(k,r)}
else if(a=='del'){if(!s.sel.size)return toast('حدد سجلًا أو أكثر');if(!confirm('حذف '+s.sel.size+' سجل؟'))return;D[k]=D[k].filter(r=>!s.sel.has(r.id));log(TT[k],'حذف',s.sel.size+' سجل');s.sel.clear();save();draw()}
else if(a=='all'){const rows=D[k].filter(r=>!s.q||JSON.stringify(Object.values(r)).includes(s.q));s.sel=s.sel.size==rows.length?new Set():new Set(rows.map(r=>r.id));fill(k)}
else if(a=='up')$('#fi').click();
else if(a=='down')xl(k,D[k]);else if(a=='tpl')xl(k,[]);
else if(a=='ref'){await load();draw();toast('تم التحديث')}
else if(a=='print')window.print();
else if(a=='det')detail(b.dataset.id);else if(a=='back'){page='veh';draw()}
else if(a=='tog'){const u=D.users.find(u=>u.id==b.dataset.id);if(u.id==me.id)return toast('لا يمكن إيقاف حسابك');u.active=!u.active;log('المستخدمون',u.active?'تفعيل':'إيقاف',u.username);save();fill('users')}
else if(a=='rp'){rf={from:$('#rf_from').value,to:$('#rf_to').value,fuel:$('#rf_fuel').value,sec:$('#rf_sec').value,plate:$('#rf_plate').value.trim(),vt:$('#rf_vt').value.trim(),op:$('#rf_op').value};draw()}
else if(a=='rx'){const ws=XLSX.utils.json_to_sheet(D.veh.map(v=>{const r=[...D.oil,...D.tire].filter(x=>x.plate==v.plate&&(!rf.from||x.date>=rf.from)&&(!rf.to||x.date<=rf.to));return{'اللوحة':v.plate,'النوع':v.type,'الوقود':v.fuel,'القطاع':v.sector,'عمليات الزيوت والفلاتر':D.oil.filter(x=>x.plate==v.plate).length,'عمليات الإطارات':D.tire.filter(x=>x.plate==v.plate).length,'إجمالي العمليات':r.length}})),wb=XLSX.utils.book_new();const f=rf,ok=r=>(!f.from||r.date>=f.from)&&(!f.to||r.date<=f.to)&&(!f.plate||nz(r.plate).includes(nz(f.plate)))&&(!f.op||r.op==f.op);XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.oil.filter(ok).map(r=>({'التاريخ':r.date,'اللوحة':r.plate,'العملية':r.op,'العداد':r.odo,'العداد القادم':r.next}))),'العمليات');XLSX.utils.book_append_sheet(wb,ws,'تقرير');XLSX.writeFile(wb,'تقرير-الصيانة.xlsx')}
else if(a=='pw'){const m=modal(`<h3>تغيير كلمة المرور</h3><label>كلمة المرور الجديدة (6 أحرف فأكثر)<input type="password" id="p1"></label><button id="ok">حفظ</button> <button class="s" id="no">إلغاء</button>`);m.querySelector('#no').onclick=m.close;m.querySelector('#ok').onclick=async()=>{const v=m.querySelector('#p1').value;if(v.length<6)return toast('كلمة المرور قصيرة');const{error}=await SB.auth.updateUser({password:v});if(error)return toast(error.message);log('المستخدمون','تغيير كلمة المرور');m.close();toast('تم التغيير')}}});
document.addEventListener('input',e=>{const i=e.target.dataset&&e.target.dataset.f;if(i!==undefined){st[page].f[i]=e.target.value;fill(page,0)}});
if(SB)login();else cfg();
